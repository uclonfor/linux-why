name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python -m build
      - name: Verify clean wheel installation and both console scripts
        run: |
          for wheel in dist/*.whl; do
            LINUX_WHY_TEST_WHEEL="$wheel" pytest -q tests/test_packaging.py
          done
      - run: linux-why --help
      - run: why --help
